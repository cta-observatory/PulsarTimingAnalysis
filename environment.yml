# Conda environment to use and develop ptiming_ana
#
#   mamba env create -f environment.yml
#   mamba activate pulsar-lst1
#   pip install -e .
#
name: pulsar-lst1
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.13
  - pip
  # lstchain brings ctapipe, gammapy, astropy, numpy, pandas, scipy, iminuit...
  # and protozfits, which is not available in PyPI for macOS
  - lstchain>=0.12
  - gammapy>=1.1
  - h5py
  - iminuit>=2.8
  - matplotlib>=3.7
  - numba
  - pytables
  - pyyaml
  - regions
  - scipy>=1.9
  # Interactive use
  - ipython
  - jupyter
  # Development
  - pre-commit
  - pytest
  - pytest-cov
  - ruff
  - pip:
      - pint-pulsar>=1.0  # not available for arm64 on conda-forge
