name: CI

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run to detect incompatibilities with new versions of the dependencies
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTEST_ADDOPTS: --color=yes

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (3.10, pip, oldest lstchain)
            os: ubuntu-latest
            python-version: "3.10"
            install-method: "pip"
            extra-requirements: "lstchain==0.10.6 numpy<2 setuptools<81"

          - name: Linux (3.11, pip)
            os: ubuntu-latest
            python-version: "3.11"
            install-method: "pip"

          - name: Linux (3.12, pip)
            os: ubuntu-latest
            python-version: "3.12"
            install-method: "pip"
            network-tests: true

          - name: Linux (3.11, mamba)
            os: ubuntu-latest
            python-version: "3.11"
            install-method: "mamba"

          - name: macOS arm64 (3.12, mamba)
            os: macos-latest
            python-version: "3.12"
            install-method: "mamba"

    defaults:
      run:
        # Need login shells (-l) for activating mamba env.
        shell: bash -leo pipefail {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mamba setup
        if: matrix.install-method == 'mamba'
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
          environment-file: environment.yml
          cache-downloads: true
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Python setup
        if: matrix.install-method == 'pip'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          EXTRA_REQUIREMENTS: ${{ matrix.extra-requirements }}
        run: |
          python --version | grep "Python ${PYTHON_VERSION}"
          pip install ".[test]" ${EXTRA_REQUIREMENTS}
          pip list

      - name: Tests
        run: |
          pytest --cov --cov-report=xml --cov-report=term

      - name: Tests that need network access
        if: matrix.network-tests
        run: |
          pytest --run-network -m network --cov --cov-append --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install doc dependencies
        run: |
          pip install -e ".[doc]"
          python -c 'import ptiming_ana; print(ptiming_ana.__version__)'

      - name: Build docs
        run: cd docs && make html SPHINXOPTS="-W --keep-going -n --color -j auto"

      - name: Deploy to github pages
        # Only the documentation of the main branch is published
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/build/html

  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
